name: ORBIS Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Check CLI
        run: |
          orbis --version
          orbis info
          orbis geojson examples/point-demo.geojson --pretty

      - name: Validate website and project metadata
        run: |
          node --input-type=module --check < cloudflare/worker.js
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          json.loads(Path("examples/point-demo.geojson").read_text(encoding="utf-8"))
          with Path("wrangler.toml").open("rb") as stream:
              tomllib.load(stream)
          readme = Path("README.md").read_text(encoding="utf-8")
          assert "\\\\n" not in readme, "README contains literal escaped newlines"
          PY
