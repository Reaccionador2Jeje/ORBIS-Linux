name: Build ORBIS Linux ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: orbis-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools
      - name: Validate desktop and build scripts
        run: |
          python3 -m py_compile config/includes.chroot/usr/share/orbis/desktop/orbis_earth.py
          sh -n config/auto/config
          sh -n config/hooks/live/0200-install-orbis-core.hook.chroot
      - name: Stage ORBIS Core for installation
        run: |
          sudo mkdir -p config/includes.chroot/usr/share/orbis/source
          sudo cp -a src pyproject.toml README.md LICENSE config/includes.chroot/usr/share/orbis/source/
          sudo chown -R "$USER":"$USER" config
          chmod +x config/auto/config config/hooks/live/*.hook.chroot config/includes.chroot/usr/local/bin/orbis-earth config/includes.chroot/etc/skel/Desktop/*.desktop
      - name: Configure Debian Trixie live system
        run: |
          # Clear generated live-build state so no previous distro can leak into this build.
          sudo rm -f config/binary config/bootstrap config/chroot config/common config/source
          sudo lb config
          echo "=== generated live-build configuration ==="
          for file in config/bootstrap config/chroot config/binary config/common; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              sudo grep -E '^(LB_MODE|LB_DISTRIBUTION|LB_MIRROR_BOOTSTRAP|LB_MIRROR_CHROOT|LB_MIRROR_BINARY)=' "$file" || true
            fi
          done
          # Validate only generated live-build configuration, never the whole source tree.
          for file in config/bootstrap config/chroot config/binary config/common; do
            if [ -f "$file" ]; then
              if sudo grep -Eiq 'precise|archive[.]ubuntu[.]com' "$file"; then
                echo "::error::Ubuntu Precise configuration found in generated live-build state: $file"
                exit 1
              fi
            fi
          done
          sudo grep -Eq '^LB_DISTRIBUTION="trixie"$' config/bootstrap
          sudo grep -Eq '^LB_MODE="debian"$' config/bootstrap
          sudo grep -Eq '^LB_MIRROR_BOOTSTRAP="https://deb[.]debian[.]org/debian"$' config/bootstrap
      - name: Build hybrid ISO
        run: sudo lb build
      - name: Verify image
        run: |
          test -s live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso
          sha256sum live-image-amd64.hybrid.iso | tee SHA256SUMS
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: orbis-linux-0.1.0-amd64-iso
          path: |
            live-image-amd64.hybrid.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
