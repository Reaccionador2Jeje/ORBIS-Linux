name: Build ORBIS Linux ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "auto/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

concurrency:
  group: orbis-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install Debian Trixie live-build on the privileged runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils cpio distro-info xorriso squashfs-tools python3 python3-venv \
            python3-setuptools ruby ca-certificates curl wget file git debian-archive-keyring
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main" | \
            sudo tee /etc/apt/sources.list.d/orbis-live-build.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 debootstrap=1.0.141
          sudo apt-get check
          lb --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ORBIS desktop, installer and build scripts
        run: |
          python3 -m py_compile config/includes.chroot/usr/share/orbis/desktop/orbis_earth.py
          sh -n auto/config
          sh -n config/hooks/live/0200-install-orbis-core.hook.chroot
          sh -n config/hooks/live/0300-validate-orbis-installer.hook.chroot
          sh -n config/includes.chroot/usr/local/bin/orbis-installer
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f) }' \
            config/includes.chroot/etc/calamares/settings.conf \
            config/includes.chroot/etc/calamares/modules/unpackfs.conf \
            config/includes.chroot/etc/calamares/modules/partition.conf \
            config/includes.chroot/etc/calamares/modules/users.conf \
            config/includes.chroot/etc/calamares/modules/displaymanager.conf \
            config/includes.chroot/usr/share/calamares/branding/orbis/branding.desc

      - name: Stage ORBIS Core and installer launchers
        run: |
          sudo mkdir -p config/includes.chroot/usr/share/orbis/source
          sudo cp -a src pyproject.toml README.md LICENSE config/includes.chroot/usr/share/orbis/source/
          sudo chmod +x auto/config \
            config/hooks/live/*.hook.chroot \
            config/includes.chroot/usr/local/bin/orbis-earth \
            config/includes.chroot/usr/local/bin/orbis-installer \
            config/includes.chroot/etc/skel/Desktop/*.desktop

      - name: Configure Debian Trixie live system
        run: |
          sudo rm -f config/binary config/bootstrap config/chroot config/common config/source
          sudo lb --version
          sudo lb config
          echo "=== generated live-build configuration ==="
          for file in config/bootstrap config/chroot config/binary config/common; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              sudo grep -E '^(LB_MODE|LB_DISTRIBUTION|LB_DEBIAN_INSTALLER|LB_SECURITY|LB_LINUX_PACKAGES|LB_MIRROR_BOOTSTRAP|LB_MIRROR_CHROOT|LB_MIRROR_BINARY)=' "$file" || true
            fi
          done
          echo "=== legacy Ubuntu entries (diagnostic only) ==="
          for file in config/bootstrap config/chroot config/binary config/common; do
            if [ -f "$file" ]; then
              sudo grep -Ein 'precise|archive[.]ubuntu[.]com' "$file" || true
            fi
          done
          sudo grep -Fqx 'LB_DISTRIBUTION="trixie"' config/bootstrap
          sudo grep -Fqx 'LB_MODE="debian"' config/common
          sudo grep -Fqx 'LB_DEBIAN_INSTALLER="none"' config/binary
          sudo grep -Fqx 'LB_SECURITY="false"' config/chroot
          sudo grep -Fqx 'LB_LINUX_PACKAGES="linux-image-amd64"' config/chroot
          sudo grep -Fqx 'linux-image-amd64' config/package-lists/orbis-desktop.list.chroot
          for package in grub-pc-bin grub-efi-amd64-bin; do
            sudo grep -Fqx "$package" config/package-lists/orbis-desktop.list.chroot
          done
          for package in xserver-xorg xserver-xorg-video-all xserver-xorg-input-all dbus-x11 mate-polkit; do
            sudo grep -Fqx "$package" config/package-lists/orbis-desktop.list.chroot
          done
          sudo grep -Fqx 'deb https://security.debian.org/debian-security @DISTRIBUTION@-security @ARCHIVE_AREAS@' config/archives/debian-security.list.chroot
          for setting in LB_MIRROR_BOOTSTRAP LB_MIRROR_CHROOT LB_MIRROR_BINARY; do
            sudo grep -RqsF "$setting=\"https://deb.debian.org/debian\"" config
          done
          if sudo grep -RIEq '^[[:space:]]*LB_(DISTRIBUTION|MODE|MIRROR_[A-Z_]+)=.*(precise|ubuntu)' config; then
            echo "Unexpected active Ubuntu live-build setting found" >&2
            exit 1
          fi

      - name: Build hybrid ISO
        run: sudo lb build

      - name: Verify image
        run: |
          sudo test -s live-image-amd64.hybrid.iso
          sudo file live-image-amd64.hybrid.iso
          sudo sha256sum live-image-amd64.hybrid.iso | tee SHA256SUMS

      - name: Publish ISO release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbis-iso-${{ github.run_id }}-${{ github.run_attempt }}
          name: ORBIS Linux ISO build ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            live-image-amd64.hybrid.iso
            SHA256SUMS
