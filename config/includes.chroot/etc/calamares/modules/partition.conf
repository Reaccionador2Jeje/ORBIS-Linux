# Conservative defaults; users choose the target disk and layout in the UI.
defaultFileSystemType: ext4
availableFileSystemTypes:
  - ext4
  - btrfs
  - xfs
efiSystemPartition: 512
efiSystemPartitionName: EFI
efiSystemPartitionFilesystem: fat32
efiSystemPartitionMountPoint: /boot/efi
efiSystemPartitionFlags:
  - boot
  - esp
