# ORBIS partitioning defaults.
# Never preselect a destructive whole-disk action.
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: "EFI"

initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"
  - "xfs"
